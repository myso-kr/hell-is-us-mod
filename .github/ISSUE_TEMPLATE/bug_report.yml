name: Something is wrong
description: A bug that is not about a game update
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Open the panel (`)\n2. …"
  - type: input
    id: versions
    attributes:
      label: hiumod version, Steam build, game language
      placeholder: "0.1.0, 24045435, Korean"
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: hiumod doctor (if it is about attaching or reading the game)
      render: text
  - type: markdown
    attributes:
      value: |
        Please describe places and quests in your own words rather than pasting the
        game's text — this repository keeps none of it.
