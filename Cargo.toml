[package]
name = "hiumod"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Single-player cheats and a minimap overlay for Hell Is Us (Steam) — external memory, no game files modified"
license = "MIT"
repository = "https://github.com/myso-kr/hell-is-us-mod"

[[bin]]
name = "hiumod"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# The overlay. glow rather than wgpu: one small OpenGL context is all a panel needs.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
resvg = { version = "0.45", default-features = false }
