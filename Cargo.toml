[package]
name = "hiumod"
version = "0.8.0"
edition = "2021"
rust-version = "1.82"
description = "A companion for Hell Is Us on PC: minimap, quest guide, puzzle answers and single-player cheats — no game files modified"
license = "MIT"
repository = "https://github.com/myso-kr/hell-is-us-mod"

[[bin]]
name = "hiumod"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# The overlay. glow rather than wgpu: one small OpenGL context is all a panel needs.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
# CSS Flexbox and Grid for the panel (taffy, via egui): MIT.
egui_taffy = "0.14"
raw-window-handle = "0.6"
# update.rs: checking a downloaded release against its .sha256. Pure Rust, MIT/Apache-2.0.
sha2 = { version = "0.10", default-features = false }
# ui/composed.rs: the large overlays through DirectComposition (COM, which windows-sys has not).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # screenroute.rs: the game view's layer paced by the compositor (DwmFlush).
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    # tray.rs: the notification-area icon, and the one-panel mutex.
    "Win32_UI_Shell",
    "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
resvg = { version = "0.45", default-features = false }
serde_json = "1"
